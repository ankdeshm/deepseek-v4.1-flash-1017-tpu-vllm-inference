apiVersion: v1
kind: Pod
metadata:
  name: step0-p-poola-h0
  namespace: default
  labels:
    app: dsv41-step0
    role: prefill
  annotations:
    gke-gcsfuse/volumes: "true"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  serviceAccountName: default
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: ank-tpu-v7x-8-pool-a
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x2
    kubernetes.io/hostname: gke-tpu-51ea19d7-rqkr
  tolerations:
  - key: "google.com/tpu"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "cloud.google.com/gke-queued"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: runner
    image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
    command: ["python3", "-u", "/scripts/step0_preflight_driver.py", "--pod-role=poola-h0"]
    env:
    - name: PJRT_DEVICE
      value: "TPU"
    resources:
      requests:
        google.com/tpu: "4"
      limits:
        google.com/tpu: "4"
    volumeMounts:
    - name: dshm
      mountPath: /dev/shm
    - name: models-gcs
      mountPath: /models
    - name: scripts
      mountPath: /scripts
  volumes:
  - name: dshm
    hostPath:
      path: /dev/shm
      type: Directory
  - name: models-gcs
    persistentVolumeClaim:
      claimName: ank-usc1-models-pvc
  - name: scripts
    configMap:
      name: dsv41-step0-scripts
---
