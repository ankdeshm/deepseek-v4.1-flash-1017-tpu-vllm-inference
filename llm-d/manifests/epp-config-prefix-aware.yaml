# R4 Condition (b): llm-d Prefix-Cache-Aware Disaggregated Prefill Routing
# Enables `approx-prefix-cache-producer` (maxPrefixTokensToMatch=131072) + `prefix-cache-affinity-filter`
# (peakPrefillThroughput=33821) on the `prefill` scheduling profile so multi-turn agentic trunks route
# consistently to the Prefill instance holding their cached KV prefix.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-disaggregation-epp
  namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: pd-disaggregation
    meta.helm.sh/release-namespace: default
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  pd-config.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: approx-prefix-cache-producer
      parameters:
        maxPrefixTokensToMatch: 131072
    - type: inflight-load-producer
    - type: prefix-cache-affinity-filter
      parameters:
        peakPrefillThroughput: 33821
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker
