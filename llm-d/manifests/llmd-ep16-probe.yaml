apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llmd-ep16-probe
  namespace: default
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: "cloud.google.com/gke-nodepool"
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: None
    leaderTemplate:
      metadata:
        labels:
          app: dsv41-step2-probe
          role: leader
        annotations:
          gke-gcsfuse/volumes: "true"
      spec:
        serviceAccountName: default
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        nodeSelector:
          cloud.google.com/gke-nodepool: ank-tpu-v7x-8-pool-b
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: 2x2x2
          kubernetes.io/hostname: gke-tpu-771db71a-059c
        tolerations:
          - key: "google.com/tpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"
        initContainers:
          - name: routing-proxy-check
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
            imagePullPolicy: IfNotPresent
            args:
              - --help
        containers:
          - name: probe
            image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command: ["python3", "-u", "/scripts/step2_task_b_probe.py", "--host-tag=poolb-059c"]
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: tpu-plugin
                mountPath: /var/run/tpu-plugin
              - name: models-gcs
                mountPath: /models
              - name: scripts
                mountPath: /scripts
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 850Gi
          - name: tpu-plugin
            hostPath:
              path: /var/run/tpu-plugin
              type: DirectoryOrCreate
          - name: models-gcs
            persistentVolumeClaim:
              claimName: ank-usc1-models-pvc
          - name: scripts
            configMap:
              name: dsv41-step2-probe-scripts
    workerTemplate:
      metadata:
        labels:
          app: dsv41-step2-probe
          role: worker
        annotations:
          gke-gcsfuse/volumes: "true"
      spec:
        serviceAccountName: default
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        nodeSelector:
          cloud.google.com/gke-nodepool: ank-tpu-v7x-8-pool-b
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: 2x2x2
          kubernetes.io/hostname: gke-tpu-771db71a-cz6l
        tolerations:
          - key: "google.com/tpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: probe
            image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command: ["python3", "-u", "/scripts/step2_task_b_probe.py", "--host-tag=poolb-cz6l"]
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: tpu-plugin
                mountPath: /var/run/tpu-plugin
              - name: models-gcs
                mountPath: /models
              - name: scripts
                mountPath: /scripts
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 850Gi
          - name: tpu-plugin
            hostPath:
              path: /var/run/tpu-plugin
              type: DirectoryOrCreate
          - name: models-gcs
            persistentVolumeClaim:
              claimName: ank-usc1-models-pvc
          - name: scripts
            configMap:
              name: dsv41-step2-probe-scripts
