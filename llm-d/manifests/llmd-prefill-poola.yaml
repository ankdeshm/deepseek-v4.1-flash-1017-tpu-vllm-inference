apiVersion: v1
kind: Pod
metadata:
  name: llmd-prefill-poola-h0
  namespace: default
  labels:
    app: llmd-prefill-poola
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "pd-disaggregation"
    llm-d.ai/role: "prefill"
    role: prefill
  annotations:
    gke-gcsfuse/volumes: "true"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  serviceAccountName: default
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: ank-tpu-v7x-8-pool-a
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x2
    kubernetes.io/hostname: gke-tpu-51ea19d7-rqkr
  tolerations:
  - key: "google.com/tpu"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "cloud.google.com/gke-queued"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: vllm-prefill
    image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
    command:
    - bash
    - -lc
    - |
      for i in $(seq 1 30); do
        [ -f /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_prefill_poola_driver.py ] && break
        sleep 1
      done
      exec python3 -u /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_prefill_poola_driver.py --shard=h0
    ports:
    - name: http
      containerPort: 8000
      protocol: TCP
    - name: tpu-kv-xfer-p
      containerPort: 9100
      protocol: TCP
    - name: kv-rendezvous
      containerPort: 14579
      protocol: TCP
    - name: tpu-pd-coord
      containerPort: 9600
      protocol: TCP
    readinessProbe:
      httpGet:
        path: /v1/models
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    env:
    - name: PJRT_DEVICE
      value: "TPU"
    - name: PYTHONHASHSEED
      value: "0"
    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
      value: "120"
    resources:
      requests:
        google.com/tpu: "4"
      limits:
        google.com/tpu: "4"
    volumeMounts:
    - name: dshm
      mountPath: /dev/shm
    - name: tpu-plugin
      mountPath: /var/run/tpu-plugin
    - name: models-gcs
      mountPath: /models
  volumes:
  - name: dshm
    hostPath:
      path: /dev/shm
      type: Directory
  - name: tpu-plugin
    hostPath:
      path: /var/run/tpu-plugin
      type: DirectoryOrCreate
  - name: models-gcs
    persistentVolumeClaim:
      claimName: ank-usc1-models-pvc
---
