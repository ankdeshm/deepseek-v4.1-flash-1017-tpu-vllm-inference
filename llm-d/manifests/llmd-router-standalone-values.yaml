# llm-d v1.0.0 Standalone Router (Envoy + EndpointPicker) Helm values
# Release: pd-disaggregation (namespace: default)
# Chart: oci://ghcr.io/llm-d/charts/llm-d-router-standalone --version v1.0.0
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  inferencePool:
    create: true
    failureMode: "FailOpen"

  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "pd-disaggregation"

  monitoring:
    interval: "10s"
    prometheus:
      # Keep ServiceMonitor disabled (no prometheus-operator CRD on cluster),
      # while disabling bearer-token auth on :9090/metrics for direct scraping.
      enabled: false
      auth:
        enabled: false

  proxy:
    enabled: true
    proxyType: envoy
    mode: sidecar
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "4"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        memory: 4Gi

  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v1.0.0
      pullPolicy: IfNotPresent
    flags:
      v: 2
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        memory: 4Gi
    # Strictly pin EPP + Envoy router pod onto CPU default-pool (never TPU nodes)
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values:
                    - default-pool
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    pluginsConfigFile: "pd-config.yaml"
    pluginsCustomConfig:
      pd-config.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 131072
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 33821
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
