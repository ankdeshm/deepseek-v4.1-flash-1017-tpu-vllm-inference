apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llmd-decode-ep16
  namespace: default
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: "cloud.google.com/gke-nodepool"
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: llmd-decode-ep16
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "pd-disaggregation"
          llm-d.ai/role: "decode"
          role: leader
        annotations:
          gke-gcsfuse/volumes: "true"
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        serviceAccountName: default
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        nodeSelector:
          cloud.google.com/gke-nodepool: YOUR_TPU_V7X_POOL_B
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: 2x2x2
          kubernetes.io/hostname: <gke-node>
        tolerations:
          - key: "google.com/tpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"
        initContainers:
          - name: routing-proxy
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
            imagePullPolicy: IfNotPresent
            args:
              - --port=8000
              - --model-server-port=9400
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-serving=false
              - --metrics-port=9091
            ports:
              - name: sidecar
                containerPort: 8000
                protocol: TCP
              - name: sidecar-metrics
                containerPort: 9091
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        containers:
          - name: vllm-decode
            image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command: ["bash", "-lc"]
            args:
              - |
                for i in $(seq 1 30); do
                  [ -f /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_decode_ep16_driver.py ] && break
                  sleep 1
                done
                exec python3 -u /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_decode_ep16_driver.py \
                  --node-role=leader \
                  --leader-ip=<private-ip> \
                  --run-id=llmd_ep16
            ports:
              - name: modelserver
                containerPort: 9400
                protocol: TCP
              - name: tpu-kv-xfer-d
                containerPort: 9200
                protocol: TCP
              - name: kv-rendezvous
                containerPort: 14579
                protocol: TCP
              - name: tpu-pd-coord
                containerPort: 9600
                protocol: TCP
            readinessProbe:
              httpGet:
                path: /v1/models
                port: 8000
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: tpu-plugin
                mountPath: /var/run/tpu-plugin
              - name: models-gcs
                mountPath: /models
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 850Gi
          - name: tpu-plugin
            hostPath:
              path: /var/run/tpu-plugin
              type: DirectoryOrCreate
          - name: models-gcs
            persistentVolumeClaim:
              claimName: YOUR_MODELS_PVC
    workerTemplate:
      metadata:
        labels:
          app: llmd-decode-ep16
          role: worker
        annotations:
          gke-gcsfuse/volumes: "true"
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        serviceAccountName: default
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        nodeSelector:
          cloud.google.com/gke-nodepool: YOUR_TPU_V7X_POOL_B
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: 2x2x2
          kubernetes.io/hostname: <gke-node>
        tolerations:
          - key: "google.com/tpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: vllm-decode
            image: docker.io/vllm/vllm-tpu@sha256:f9565be370a7af2b631198aa95f891221a974b2b1727d22db9b275923d3261c6
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command: ["bash", "-lc"]
            args:
              - |
                for i in $(seq 1 30); do
                  [ -f /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_decode_ep16_driver.py ] && break
                  sleep 1
                done
                exec python3 -u /models/dsv41-v7x-llmd-20261106/step2_llmd/step2_decode_ep16_driver.py \
                  --node-role=worker \
                  --leader-ip=<private-ip> \
                  --run-id=llmd_ep16
            resources:
              requests:
                google.com/tpu: "4"
              limits:
                google.com/tpu: "4"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: tpu-plugin
                mountPath: /var/run/tpu-plugin
              - name: models-gcs
                mountPath: /models
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 850Gi
          - name: tpu-plugin
            hostPath:
              path: /var/run/tpu-plugin
              type: DirectoryOrCreate
          - name: models-gcs
            persistentVolumeClaim:
              claimName: YOUR_MODELS_PVC
